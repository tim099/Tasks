<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockside・指揮官沙盒（2D）</title>
<!-- TASK-0551：艦隊指揮官的 2D 策略沙盒。開發用（Blockside 根目錄的 sandbox.html）。
     指揮官 js/53_commander.js 跟遊戲是同一份；模擬 js/sb_sim.js（照抄遊戲的航行公式、數字從遊戲量）；畫面與批次 js/sb_ui.js。
     建置：python -I ../VoxelKit/vxk_inline.py sandbox.html ../sandbox.html -->
<style>
  :root{ --ink:#e8eef5; --dim:#9fb0c2; }
  html,body{ margin:0; background:#0e1a26; color:var(--ink); font:14px/1.5 system-ui, "Microsoft JhengHei", sans-serif; }
  #top{ padding:8px 12px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; border-bottom:1px solid rgba(255,255,255,.1); }
  #top label{ color:var(--dim); } select, input{ font:inherit; background:#1a2a3a; color:var(--ink); border:1px solid rgba(255,255,255,.2); border-radius:5px; padding:2px 5px; }
  input[type=number]{ width:56px; }
  button{ font:inherit; background:rgba(255,255,255,.08); color:var(--ink); border:1px solid rgba(255,255,255,.25); border-radius:5px; padding:3px 10px; cursor:pointer; }
  button.on{ background:#e0b453; color:#111; }
  #main{ display:flex; gap:10px; padding:8px 12px; flex-wrap:wrap; }
  #cv{ flex:1 1 560px; height:62vh; min-height:340px; border-radius:6px; }
  #side{ flex:0 1 380px; font-size:12px; max-height:62vh; overflow:auto; }
  .sr{ padding:2px 4px; border-left:3px solid; margin:2px 0; } .sr.blue{ border-color:#5aa2ff; } .sr.red{ border-color:#ff6b5a; } .sr.out{ opacity:.5; }
  #batch{ padding:6px 12px 20px; } #btab{ border-collapse:collapse; margin-top:6px; } #btab th, #btab td{ border:1px solid rgba(255,255,255,.15); padding:4px 8px; text-align:center; } #btab small{ color:var(--dim); }
  .note{ color:var(--dim); font-size:12px; max-width:980px; }
  @media (max-width:520px){ #cv{ height:48vh; } #top{ gap:4px 8px; } }
</style>
</head>
<body>
<div id="top">
  <b>指揮官沙盒（2D）</b>
  <span><label>藍</label> <input type="number" id="blueN" min="1" max="8" value="4"> <select id="blueH"></select> <select id="blueC"></select></span>
  <span><label>紅</label> <input type="number" id="redN" min="1" max="8" value="4"> <select id="redH"></select> <select id="redC"></select></span>
  <span><label>距離</label> <input type="number" id="dist" min="50" max="1000" step="10" value="140"> m</span>
  <span><label>風</label> <select id="wind"><option value="rnd">照種子</option><option value="0">往 +x</option><option value="90">往 +z</option><option value="180">往 −x</option><option value="270">往 −z</option></select></span>
  <span><label>玩法</label> <select id="play"><option value="fun">娛樂</option><option value="real">寫實</option></select></span>
  <span><label>種子</label> <input type="number" id="seed" value="1"></span>
  <button id="go">開始</button> <button id="pause">暫停</button>
  <span id="spd"><button data-s="1">1×</button><button data-s="4" class="on">4×</button><button data-s="16">16×</button><button data-s="64">64×</button></span>
  <span id="stat"></span>
</div>
<div id="main"><canvas id="cv"></canvas><div id="side"><div id="ships"></div></div></div>
<div id="batch">
  <button id="bgo">批次對打</button> <label>每格</label> <input type="number" id="bn" value="40" min="2" step="2"> 場　<label>每場最多</label> <input type="number" id="bt" value="900" step="60"> 秒　<span id="bprog" class="note"></span>
  <table id="btab"></table>
  <p class="note">批次：兩方的編成照上面那一列，策略兩兩對打；每一格的場一半換邊（藍紅、編成一起對調）⇒ 格子裡是「列的策略打欄的策略」的勝率（到時限還沒分出來 ⇒ 判定：比兩方剩下的戰力；差太少才算和局，和局算半場）、平均打多久、平均多剩幾艘。
    沙盒只模擬指揮官要的東西（位置、航向、照風的航速、兩舷的砲、船殼／砲／人三條血、每根桅的帆：中彈會隨機打掉帆、打倒桅，帆少了就慢），數字從遊戲量；風向、風速照種子（跟遊戲一樣隨機）；名次要拿完整的遊戲對照過才算數（TASK-0551）。</p>
</div>
<script>
(function () {
'use strict';
// ── js/53_commander.js ──
// ───────────────────────── 艦隊指揮官（TASK-0551） ─────────────────────────
// Tim 2026-10-14：「加一個艦隊指揮官 AI 用來制定全局策略」「我方友艦也聽我方指揮官」。
// ⛔ 這一檔是純邏輯：只讀「局勢」、只回「命令」，不碰遊戲的全域變數 ⇒ 遊戲（52_fleet.js cmdTick）與 2D 沙盒（sandbox）載入同一份。
//
// 局勢 view：{ t（秒）, wind: [x, z]（風吹去的方向，單位向量）, side（'blue'／'red'：替哪一方想）, ships: [s…] }
//   s：{ id, team, x, z, yaw（船頭 ＝ [cos, −sin]）, spd（m/s）, hp（船殼 0..1）, guns（砲 0..1）, crew（人 0..1）, mass（開戰排水量）, len（水線長 m）,
//        out（沉了、在沉、降旗）, cmd（指揮得動：玩家自己開的那艘 ⇒ false）, tgt（現在打的那艘 id；玩家那艘照它自己的）}
//   view 選填（TASK-0679；沒給 ⇒ 跟以前一樣，沙盒就沒給）：R（交戰距離 m）、gauge（這一方要不要搶上風）、signal（玩家的旗號：{ strat, lead, focus, gauge }，蓋過設定的策略）；
//   s.lerr、s.llag、s.larc、s.loff（戰列跟隨：離站位多遠、沿航跡落後多少、沿排頭航跡離排頭多遠、離航跡多遠 m，遊戲上一步量的）。
//   s.asp（選填）：這艘的武器主要朝哪裡 —— 'B' 船頭／'A' 船尾（比正橫兩舷火力大）／'side'；沒給 ＝ 'side'（54_helm.js helmAspect）。
// 命令 orders：{ [id]: { target（打哪艘 id；null ⇒ 照船自己挑）, mode, leader（戰列：跟著誰；站位每一步照它現在的位置算）, throttle（油門；沒寫 ＝ 1）,
//   side（排頭：交戰的那一舷 'P'／'S'）, pace（排頭：巡航的幾成）, tack（搶上風：往風軸哪一側搶，±1）} }
//   mode：'engage' 交戰 ／ 'line' 戰列跟隨（遊戲：cmdHelmWake 跟前一艘的航跡；沙盒：cmdHelmLine）／ 'lead' 戰列的排頭（遊戲 54_helm.js helmLead；沙盒當交戰）／ 'gauge' 搶上風（helmGauge）
// 記憶 mem：每一方一份（配對、集火的目標、戰列的順序、搶上風的進度），下一次想的時候接著用 ⇒ 不會每想一次就整個換一套；換策略、換旗號 ⇒ 除了搶上風都重來。
var CMD_STRATS = ['free', 'pair', 'focus', 'line', 'auto'];
var CMD_NAMES = { free: '各自為戰', pair: '一對一配對', focus: '集火', line: '戰列', auto: '推演' };   // 推演（TASK-0688）：每 30 秒把配對／集火／戰列各往前推 90 秒、挑最好的（56_rollout.js rollStrat）
var CMD_LINE_GAP = 70;                                                   // 戰列：前後兩艘的中心隔多遠（m；憲法號水線長 55 m ⇒ 頭尾隔 15 m）；自動調參調出來的（TASK-0687，2026-10-18，撞在下限 70；調之前 90）
// 搶上風（TASK-0679）：我方中心比敵方中心多上風 CMD_GAUGE_UP ⇒ 搶到；CMD_GAUGE_MAX 秒沒搶到、或敵我最近的兩艘近於 CMD_GAUGE_NEAR × 交戰距離 ⇒ 不搶了、接戰。
//   往風軸哪一側搶：敵方中心在哪一側就往哪一側（離風軸 CMD_GAUGE_SIDE 以內不換邊 ⇒ 不會一直換舷搶風）。
var CMD_GAUGE_UP = 150, CMD_GAUGE_MAX = 240, CMD_GAUGE_NEAR = 1.5, CMD_GAUGE_SIDE = 120;
// 戰列的排頭（TASK-0679）：期望航速 ＝ 巡航 × pace（隊形還沒排好 ⇒ CMD_PACE_FORM 等後面的跟上）；跟隨（cmdHelmWake）：沿航跡往前 CMD_WAKE_LA 那一點開、落後 1 m ⇒ 快 CMD_WAKE_K m/s
var CMD_PACE = 0.9, CMD_PACE_FORM = 0.7, CMD_WAKE_LA = 40, CMD_WAKE_K = 0.04, CMD_WAKE_VMIN = 0.8, CMD_WAKE_FAR = 80, CMD_WAKE_AWAY = 0.5;   // AWAY：在排頭旁邊或前面時往遠離排頭那邊偏多少（跟排頭航向合成；0.5 ≈ 27°）

function cmdDist(a, b) { return Math.hypot(a.x - b.x, a.z - b.z); }
function cmdStrength(s) { return 0.5 * s.hp + 0.3 * s.guns + 0.2 * s.crew; }   // 還剩多少戰力（0..1）
/** 可調參數（TASK-0687）：這一方的覆寫（cmdView 帶進來的 view.tune，存在 mem.tn）有這一鍵 ⇒ 用它，沒有 ⇒ d（原本的常數）。2D 沙盒沒有覆寫 ⇒ 一律 d。 */
function cmdTune(mem, k, d) { var t = mem.tn; return t && t[k] !== undefined ? t[k] : d; }
function cmdCenter(L) { var x = 0, z = 0; L.forEach(function (s) { x += s.x; z += s.z; }); return L.length ? { x: x / L.length, z: z / L.length } : null; }

/** 替 view.side 那一方想一次。strat：CMD_STRATS 其中一個；free ⇒ 不下命令（船照自己的：最近的敵艦）。
 *  玩家的旗號（view.signal）蓋過 strat：成戰列跟我 ⇒ 排頭 ＝ 玩家那艘；集火我的目標 ⇒ 集火那艘。搶上風（view.gauge 或旗號的 gauge）疊在任何策略上（cmdGauge）。 */
function cmdThink(view, strat, mem) {
  var own = view.ships.filter(function (s) { return s.team === view.side && !s.out; });
  var foes = view.ships.filter(function (s) { return s.team !== view.side && !s.out; });
  var orders = {}, sig = view.signal || null;
  if (sig && CMD_NAMES[sig.strat]) strat = sig.strat;
  if (!CMD_NAMES[strat]) strat = 'free';
  if (strat === 'auto') strat = typeof rollStrat === 'function' ? rollStrat(view, mem) : 'pair';   // 推演 ⇒ 這一次照挑中的那個想（56_rollout.js；玩家的旗號照樣蓋過它）
  var key = sig ? 'sig:' + strat + ':' + sig.lead + ':' + sig.focus : 'cfg:' + strat;
  if (mem.key !== key) { var g = mem.gauge, rl = mem.roll; Object.keys(mem).forEach(function (k) { delete mem[k]; }); mem.key = key; if (g) mem.gauge = g; if (rl) mem.roll = rl; }   // 換策略、換旗號 ⇒ 配對、集火、戰列重來（搶上風、推演的進度留著）
  mem.tn = view.tune || null;                                            // 這一方的可調參數覆寫（55_tune.js；平常 null）
  if (!own.length || !foes.length) return orders;
  if (strat === 'pair') cmdPair(own, foes, mem, orders);
  else if (strat === 'focus') cmdFocus(own, foes, mem, orders, sig ? sig.focus : null);
  else if (strat === 'line') cmdLine(own, foes, mem, orders, view, sig ? sig.lead : null);
  if (sig && sig.gauge !== undefined && sig.gauge !== null ? sig.gauge : view.gauge) cmdGauge(view, own, foes, mem, orders, strat);
  own.forEach(function (s) { if (!s.cmd) delete orders[s.id]; });          // 玩家自己開的那艘不下命令（但算在配對、戰列裡）
  return orders;
}

/** 一對一配對：每艘敵艦最多分到 ⌈我方艘數 ÷ 敵方艘數⌉ 艘（⇒ 不會三艘圍一艘、另一艘沒人管）。
 *  原本的配對還有效（目標沒出局、沒超過上限）就留著；其他的照「距離 ＋ 那艘已經有幾艘在打 × 300 m」最小的貪心補上（先補離敵人近的）。
 *  玩家那艘（cmd false）照它自己正在打的算進去。 */
function cmdPair(own, foes, mem, orders) {
  var cap = Math.ceil(own.length / foes.length), load = {}, asg = mem.pair || {}, ids = foes.map(function (f) { return f.id; });
  foes.forEach(function (f) { load[f.id] = 0; });
  var free = [];
  own.forEach(function (s) {
    var t = !s.cmd && s.tgt !== undefined && s.tgt !== null ? s.tgt : asg[s.id];
    if (t !== undefined && ids.indexOf(t) >= 0 && load[t] < cap) { load[t]++; asg[s.id] = t; } else free.push(s);
  });
  free.sort(function (a, b) { return Math.min.apply(null, foes.map(function (f) { return cmdDist(a, f); })) - Math.min.apply(null, foes.map(function (f) { return cmdDist(b, f); })) || a.id - b.id; });
  free.forEach(function (s) {
    var best = null, bc = 1e18;
    foes.forEach(function (f) { if (load[f.id] >= cap) return; var c = cmdDist(s, f) + 300 * load[f.id]; if (c < bc - 1e-9) { bc = c; best = f; } });
    if (!best) foes.forEach(function (f) { var c = cmdDist(s, f) + 300 * load[f.id]; if (c < bc - 1e-9) { bc = c; best = f; } });
    asg[s.id] = best.id; load[best.id]++;
  });
  mem.pair = asg;
  own.forEach(function (s) { orders[s.id] = { target: asg[s.id], mode: 'engage' }; });
}

/** 集火：全隊打同一艘 —— 敵艦裡「剩的戰力 × 0.6 ＋ 離我方中心的距離 ÷ 1000 × 0.4」最小的（弱又近）；打到它出局才換。 */
function cmdFocus(own, foes, mem, orders, want) {                         // want：玩家旗號「集火我的目標」指定的那艘（出局了 ⇒ 照上面的挑）
  var ids = foes.map(function (f) { return f.id; });
  if (want !== null && want !== undefined && ids.indexOf(want) >= 0 && mem.focus === undefined) mem.focus = want;
  if (mem.focus === undefined || ids.indexOf(mem.focus) < 0) {
    var c = cmdCenter(own), best = null, bs = 1e18, fw = cmdTune(mem, 'focusW', 0);   // fw：剩的戰力的權重，其餘給距離；0 ＝ 挑離我方中心最近的（自動調參，TASK-0687 2026-10-18；調之前 0.6）
    foes.forEach(function (f) { var sc = fw * cmdStrength(f) + (1 - fw) * cmdDist(c, f) / 1000; if (sc < bs - 1e-9) { bs = sc; best = f; } });
    mem.focus = best.id;
  }
  own.forEach(function (s) { orders[s.id] = { target: mem.focus, mode: 'engage' }; });
}

/** 戰列：旗艦（開戰排水量最大、還在打的；玩家旗號「成戰列跟我」⇒ 玩家那艘）帶頭；其他的排成縱隊，各自跟著前一艘（遊戲：照它的航跡 cmdHelmWake；沙盒：船尾 cmdHelmLine）。
 *  順序記在 mem.line（新進場的接到尾巴、出局的拿掉 ⇒ 後面的往前補）。每艘打離自己最近的敵艦（全隊用朝敵那一舷：跟著前一艘的航跡走，舷側自然朝同一邊）。
 *  排頭（TASK-0679，mode 'lead'）：照「整條戰列」開 —— 敵方中心擺在交戰那一舷（mem.side）、不換舷、不拉開；巡航 × pace（還沒排好 ⇒ 慢一點）。
 *    交戰那一舷：敵方中心在排頭的哪一舷；遠（> 2.5 × 交戰距離）而且明顯在一側的時候才重看 ⇒ 接戰之後定下來，掉頭時整條不換舷。
 *    ⛔ 以前排頭照一艘船的打法交戰（54_helm.js helmSteer：換舷、拉開、繞敵艦一艘轉圈）⇒ 後面的跟不上：量過 4 對 4、800 m，紅方跟隨 1.4–3 節、離站位 75–243 m。
 *  只有一艘 ⇒ 照舊交戰（沒有戰列可帶，跟以前一位元都不差）。 */
/** 戰列的排頭（沒有旗號指定時）：開局是橫隊 ⇒ 一齊轉向（turn together）—— 挑橫隊最外側、往外轉比較不頂風的那一端當排頭，交戰那一舷照往外轉的方向定（mem.side）；
 *  其他船一開始就都在它後面，只要橫著收攏，不用誰往後退。不是橫隊（前後拉得比左右長 1/1.5 以上）⇒ 照舊挑最重的。挑了就記住（mem.pick），出局了才重挑。
 *  ⛔ 照重量挑（以前）⇒ 4 艘一樣重 ⇒ 照編號，排頭剛好在橫隊第 2 個位置，不管往哪一舷轉都有船擋在航線上（開局頂風那一方：14–18 秒擦撞、排頭 5.8 → 0.1 節；
 *    改讓法、改超前的判準都只消掉擦撞，四個種子隊形平均沒變好：量過 wdir=0 種子 1797／11／22／33）。 */
function cmdLinePick(own, view, mem) {
  var hv = own.slice().sort(function (a, b) { return b.mass - a.mass || a.id - b.id; })[0];
  if (own.length < 2) return hv;
  var c = cmdCenter(own), fx = 0, fz = 0;
  own.forEach(function (s) { fx += Math.cos(s.yaw); fz -= Math.sin(s.yaw); });          // 平均船頭方向（fwd ＝ (cos yaw, −sin yaw)）
  var fl = Math.hypot(fx, fz); if (fl < 1e-6) return hv; fx /= fl; fz /= fl;
  var lx = fz, lz = -fx, lo = null, hi = null, a0 = 1e9, a1 = -1e9;                  // l：往左（yaw ＋ 90°）
  own.forEach(function (s) { var l = (s.x - c.x) * lx + (s.z - c.z) * lz, a = (s.x - c.x) * fx + (s.z - c.z) * fz; if (!lo || l < lo.l) lo = { s: s, l: l }; if (!hi || l > hi.l) hi = { s: s, l: l }; a0 = Math.min(a0, a); a1 = Math.max(a1, a); });
  if (hi.l - lo.l < 1 || hi.l - lo.l < 1.5 * (a1 - a0)) return hv;
  var W = view && view.wind, offL = 0, offR = 0;                                    // 往外轉之後（往左 ⇒ 左端那艘、往右 ⇒ 右端）離正頂風幾 rad：大的比較好
  if (W) { var wl = Math.hypot(W[0], W[1]) || 1, cu = Math.max(-1, Math.min(1, -(lx * W[0] + lz * W[1]) / wl)); offL = Math.acos(cu); offR = Math.acos(-cu); }
  var useL = Math.abs(offL - offR) > 0.2 ? offL > offR : hi.s.mass > lo.s.mass || hi.s.mass === lo.s.mass && hi.s.id < lo.s.id;
  mem.side = useL ? 'S' : 'P';                                                     // 往左轉 ⇒ 敵方落在右舷
  return useL ? hi.s : lo.s;
}
function cmdLine(own, foes, mem, orders, view, leadId) {
  // 武器朝船頭（船尾）的船（s.asp 'B'／'A'：持火號的 siphon、槳帆船的艏砲）不排進戰列 —— 戰列是兩舷對轟，跟著航跡走它的武器永遠對不到；
  //   改成各自交戰（mode 'engage'）打離自己最近的敵艦，艦長照自己的武器靠過去（Tim 2026-10-18：「艦隊指揮官的邏輯 需要判斷我方武器射程去指揮船隻」）。
  function near0(s) { var b = null, bd = 1e18; foes.forEach(function (f) { var d = cmdDist(s, f); if (d < bd) { bd = d; b = f; } }); return b; }
  own.filter(function (s) { return s.asp === 'B' || s.asp === 'A'; }).forEach(function (s) { orders[s.id] = { target: near0(s).id, mode: 'engage' }; });
  own = own.filter(function (s) { return s.asp !== 'B' && s.asp !== 'A'; });
  if (!own.length) return;

  for (var z = gz0; z < UI.cam.z + UI.cam.s; z += gs) { var b = P(0, z); g.beginPath(); g.moveTo(0, b[1]); g.lineTo(w, b[1]); g.stroke(); }
  // 風
  g.save(); g.translate(60, 60); g.rotate(Math.atan2(W.wind[1], W.wind[0])); g.strokeStyle = '#cfe6ff'; g.lineWidth = 3; g.beginPath(); g.moveTo(-30, 0); g.lineTo(30, 0); g.lineTo(18, -9); g.moveTo(30, 0); g.lineTo(18, 9); g.stroke(); g.restore();
  g.fillStyle = '#cfe6ff'; g.font = (12 * (window.devicePixelRatio || 1)) + 'px sans-serif'; g.fillText('風', 52, 100);
  // 齊射
  W.fx = (W.fx || []).filter(function (f) { return W.t - f.t < 0.6; });
  W.fx.forEach(function (f) { var a = P(f.x0, f.z0), b = P(f.x1, f.z1); g.strokeStyle = f.team === 'blue' ? 'rgba(140,200,255,0.55)' : 'rgba(255,150,130,0.55)'; g.lineWidth = 1 + f.n / 6; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); });
  // 命令線、站位

    if (s.out) return;
    var o = W.orders[s.id];
    if (s.foe) { var a = P(s.x, s.z), b = P(s.foe.x, s.foe.z); g.setLineDash([4, 6]); g.strokeStyle = s.team === 'blue' ? 'rgba(120,180,255,0.35)' : 'rgba(255,120,110,0.35)'; g.lineWidth = 1; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); g.setLineDash([]); }
    if (o && o.mode === 'line' && s.station) { var c = P(s.station[0], s.station[1]); g.strokeStyle = '#ffd36b'; g.beginPath(); g.arc(c[0], c[1], 5, 0, 7); g.stroke(); var p = P(s.x, s.z); g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(c[0], c[1]); g.stroke(); }
  });

  W.ships.forEach(function (s) {
    var p = P(s.x, s.z), len = s.H.len * k, wid = Math.max(3, 12 * k);

    g.beginPath(); g.moveTo(len / 2, 0); g.lineTo(len / 2 - wid, -wid / 2); g.lineTo(-len / 2, -wid / 2); g.lineTo(-len / 2, wid / 2); g.lineTo(len / 2 - wid, wid / 2); g.closePath(); g.fill();

    g.fillStyle = '#fff'; g.fillText(s.id + (W.orders[s.id] && W.orders[s.id].mode === 'line' ? '↳' : ''), p[0] + 8, p[1] - 8);
  });
  // 清單
  $('ships').innerHTML = W.ships.map(function (s) {
    var o = W.orders[s.id];
    return '<div class="sr ' + s.team + (s.out ? ' out' : '') + '"><b>' + s.id + '</b> ' + s.H.name + '　船殼 ' + Math.round(Math.max(0, s.hp) * 100) + '%　砲 ' + (s.guns.P + s.guns.S) + '　人 ' + Math.round(s.crew * 100) + '%　帆 ' + Math.round(s.sail * 100) + '%' + (function (n) { return n ? '（倒桅 ' + n + '）' : ''; })(s.masts.filter(function (m) { return !m.up; }).length) + '　' + s.spd.toFixed(1) + ' m/s' +
      (s.out ? '　<i>' + s.fate + '</i>' : '　→ ' + (s.foe ? s.foe.id : '-') + (o ? '（' + (o.mode === 'line' ? '跟 ' + o.leader : '交戰') + (o.throttle !== undefined && o.throttle < 1 ? '・慢' : '') + '）' : '')) + '</div>';
  }).join('');
  $('stat').textContent = W.t.toFixed(0) + ' 秒　風速 ×' + W.windSpd.toFixed(2) + (W.over ? '　' + (W.over.winner === 'blue' ? '藍' : '紅') + '方勝（' + W.over.t.toFixed(0) + ' 秒）' : '');
}
function sbLoop() {
  if (UI.W && UI.run && !UI.W.over) { var n = Math.round(UI.speed / 60 / SB_DT) || 1; for (var i = 0; i < n && !UI.W.over; i++) sbStep(UI.W); }
  sbDraw(); requestAnimationFrame(sbLoop);
}
/** 批次：策略兩兩對打。每一格 N 場，一半藍用列的策略、一半紅用列的策略（編成也跟著對調）。 */
function sbBatch() {
  if (UI.batch && !UI.batch.done) { UI.batch.stop = true; return; }
  var N = +$('bn').value, S = CMD_STRATS, jobs = [], res = {};
  S.forEach(function (a) { S.forEach(function (b) { res[a + '|' + b] = { w: 0, l: 0, d: 0, t: 0, left: 0, n: 0, j: 0 }; for (var i = 0; i < N; i++) jobs.push({ a: a, b: b, seed: 1000 + i, swap: i % 2 === 1 }); }); });
  UI.batch = { jobs: jobs, res: res, i: 0, stop: false, done: false, t0: performance.now() };
  $('bgo').textContent = '停止';
  (function chunk() {
    var B = UI.batch, t1 = performance.now();
    while (B.i < B.jobs.length && performance.now() - t1 < 40 && !B.stop) {
      var j = B.jobs[B.i++], o = sbOpt(j.seed), blue = o.blue, red = o.red;
      if (j.swap) { o.blue = red; o.red = blue; o.cmd = { blue: j.b, red: j.a }; } else o.cmd = { blue: j.a, red: j.b };
      var r = sbRun(o, +$('bt').value), mine = j.swap ? 'red' : 'blue', cell = B.res[j.a + '|' + j.b];
      cell.n++; cell.t += r.t; cell.left += r.left[mine] - r.left[mine === 'blue' ? 'red' : 'blue'];
      if (r.winner === mine) cell.w++; else if (r.winner) cell.l++; else cell.d++;
      if (r.judged) cell.j++;
    }
    sbTable(B);
    if (B.i < B.jobs.length && !B.stop) setTimeout(chunk, 0); else { B.done = true; $('bgo').textContent = '批次對打'; $('bprog').textContent += '　（' + ((performance.now() - B.t0) / 1000).toFixed(1) + ' 秒）'; }
  })();
}
function sbTable(B) {
  var S = CMD_STRATS;
  $('bprog').textContent = B.i + '／' + B.jobs.length + ' 場';
  $('btab').innerHTML = '<tr><th>列 打 欄</th>' + S.map(function (b) { return '<th>' + CMD_NAMES[b] + '</th>'; }).join('') + '<th>平均勝率</th></tr>' + S.map(function (a) {
    var tot = 0, cnt = 0;
    return '<tr><th>' + CMD_NAMES[a] + '</th>' + S.map(function (b) {
      var c = B.res[a + '|' + b]; if (!c.n) return '<td>…</td>';
      var wr = (c.w + c.d / 2) / c.n; if (a !== b) { tot += wr; cnt++; }
      return '<td style="background:rgba(' + (wr > 0.5 ? '90,200,120,' : '230,100,90,') + (Math.abs(wr - 0.5) * 1.2).toFixed(2) + ')">' + Math.round(wr * 100) + '%<br><small>' + (c.t / c.n).toFixed(0) + ' 秒・差 ' + (c.left / c.n).toFixed(1) + ' 艘' + (c.j ? '・判定 ' + c.j : '') + (c.d ? '・和 ' + c.d : '') + '</small></td>';
    }).join('') + '<td>' + (cnt ? Math.round(tot / cnt * 100) + '%' : '…') + '</td></tr>';
  }).join('');
}
(function init() {
  ['blueH', 'redH'].forEach(function (id) { $(id).innerHTML = Object.keys(SB_HULLS).map(function (k) { return '<option value="' + k + '">' + SB_HULLS[k].name + '</option>'; }).join(''); });
  ['blueC', 'redC'].forEach(function (id) { $(id).innerHTML = CMD_STRATS.map(function (k) { return '<option value="' + k + '"' + (k === 'pair' ? ' selected' : '') + '>' + CMD_NAMES[k] + '</option>'; }).join(''); });
  $('go').onclick = sbStart; $('pause').onclick = function () { UI.run = !UI.run; this.textContent = UI.run ? '暫停' : '繼續'; };
  [].forEach.call(document.querySelectorAll('#spd button'), function (b) { b.onclick = function () { UI.speed = +b.dataset.s; [].forEach.call(document.querySelectorAll('#spd button'), function (x) { x.className = x === b ? 'on' : ''; }); }; });
  $('bgo').onclick = sbBatch;
  sbStart(); sbLoop();
  window.__sb = { run: sbRun, opt: sbOpt, W: function () { return UI.W; }, batch: function () { return UI.batch; } };   // 量測用
})();
})();
