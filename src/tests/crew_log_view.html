<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>船員記錄</title>
<!-- 測試模式的船員記錄（js/83_testlog.js）看圖：俯看一層甲板的走路格＋砲塔那一圈＋每個船員的路徑；點一個人看他的事件。
     直接開這個檔 ⇒ 選遊戲裡匯出的 blockside-crewlog-*.json；src/tests/crew_log.py 產生的報表把資料嵌在下面那一行。 -->
<style>
:root { --bg: #0e141b; --fg: #dde6ee; --mute: #8a99a8; --line: #2a3644; --hi: #ffd166; --bad: #ff5d5d; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, sans-serif; }
header { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
header b { font-size: 15px; } select, input, button { background: #18222d; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; font: inherit; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 0; height: calc(100vh - 46px); }
#map { position: relative; overflow: hidden; border-right: 1px solid var(--line); }
#cv { width: 100%; height: 100%; display: block; cursor: crosshair; }
#side { overflow: auto; padding: 8px 10px; }
table { border-collapse: collapse; width: 100%; } td, th { padding: 2px 4px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
tr.sel td { background: #2b3a4c; } tr { cursor: pointer; } .bad { color: var(--bad); } .mute { color: var(--mute); }
#ev { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
#tip { position: absolute; pointer-events: none; background: rgba(0,0,0,.8); padding: 3px 6px; border-radius: 4px; font-size: 12px; display: none; }
@media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } #map { height: 60vh; } }
</style></head><body>
<header><b>🧪 船員記錄</b>
  <label>檔案 <input type="file" id="file" accept=".json"></label>
  <label>船 <select id="ship"></select></label>
  <label>甲板 <select id="lv"></select></label>
  <label>時間 <input type="range" id="t" min="0" max="1" step="0.5" value="1" style="width:180px"> <span id="tv"></span></label>
  <label><input type="checkbox" id="all" checked> 畫全部人的路徑</label>
  <span class="mute" id="info"></span>
</header>
<main><div id="map"><canvas id="cv"></canvas><div id="tip"></div></div>
<div id="side"><div id="sum"></div><h4 style="margin:8px 0 4px">船員（穿砲塔的排前面）</h4><table id="tab"></table><h4 style="margin:10px 0 4px">事件</h4><div id="ev" class="mute">點一個人</div></div></main>
<script>
var DATA = /*DATA*/null;
var $ = function (id) { return document.getElementById(id); };
var S = { ship: 0, lv: 0, sel: -1, t: 0 }, V = { s: 1, ox: 0, oy: 0 }, ROLEC = ['#f4a261', '#e9c46a', '#a8dadc', '#e76f51', '#90be6d', '#cdb4db', '#8ecae6'];
function load(d) {
  DATA = d; $('ship').innerHTML = d.ships.map(function (s, k) { return '<option value="' + k + '">' + s.i + ' ' + s.name + '（' + s.team + '）</option>'; }).join('');
  $('t').max = d.t; $('t').value = d.t; S.t = d.t; S.ship = 0; pickShip();
  var w = {}; d.ev.forEach(function (e) { w[e[3]] = (w[e[3]] || 0) + 1; });
  $('info').textContent = 'seed ' + d.seed + '、記 ' + d.from + '–' + (d.off !== null ? d.off : d.t) + ' 秒、' + d.cost.points + ' 點、事件 ' + Object.keys(w).map(function (k) { return k + ' ' + w[k]; }).join('／') + (d.trunc ? '、路徑在 ' + d.trunc + ' 秒截斷' : '');
}
function ship() { return DATA.ships[S.ship]; }
function pickShip() {
  var s = ship(); $('lv').innerHTML = s.levels.map(function (L, k) { return '<option value="' + k + '">' + L.name + '（z ' + L.zr[0] + '–' + L.zr[1] + '）</option>'; }).join('');
  S.lv = Math.max(0, s.levels.length - 1); $('lv').value = S.lv; S.sel = -1; fit(); table(); draw();
}
function crewOf() { var i = ship().i; return DATA.crew.filter(function (c) { return c.ship0 === i || c.ship === i; }); }
function evOf(id) { return DATA.ev.filter(function (e) { return e[2] === id; }); }
function lvOf(z) { var L = ship().levels, best = -1; L.forEach(function (l, k) { if (z >= l.zr[0] - 2 && z <= l.zr[1] + 2) best = k; }); return best; }
function table() {
  var rows = crewOf().map(function (c) { var E = evOf(c.id), w = E.filter(function (e) { return e[3] === 'wall' && e[4].what === 'ring'; }).length, hw = E.filter(function (e) { return e[3] === 'wall' && e[4].what === 'hull'; }).length, last = c.tr.length ? c.tr[c.tr.length - 1] : null; return { c: c, w: w, hw: hw, n: E.length, role: last ? last[5] : c.role0, st: last ? last[4] : 0 }; });
  rows.sort(function (a, b) { return b.w - a.w || b.hw - a.hw || a.c.id - b.c.id; });
  $('tab').innerHTML = '<tr><th>id</th><th>開局</th><th>最後</th><th>狀態</th><th title="走路穿過砲塔那一圈">穿砲塔</th><th title="小腿和胸口兩格都是船殼">碰船殼</th><th>事件</th></tr>' + rows.map(function (r) {
    return '<tr data-id="' + r.c.id + '"' + (r.c.id === S.sel ? ' class="sel"' : '') + '><td>' + r.c.id + '</td><td>' + DATA.roles[r.c.role0] + '</td><td>' + DATA.roles[r.role] + '</td><td>' + DATA.states[r.st] + '</td><td class="' + (r.w ? 'bad' : 'mute') + '">' + r.w + '</td><td class="mute">' + r.hw + '</td><td>' + r.n + '</td></tr>'; }).join('');
  [].forEach.call($('tab').querySelectorAll('tr[data-id]'), function (tr) { tr.onclick = function () { S.sel = +tr.dataset.id; var c = DATA.crew[S.sel], q = c.tr[0]; if (q) { var k = lvOf(q[3]); if (k >= 0) { S.lv = k; $('lv').value = k; } } table(); events(); draw(); }; });
  var tot = rows.reduce(function (a, r) { return a + r.w; }, 0), htot = rows.reduce(function (a, r) { return a + r.hw; }, 0);
  $('sum').innerHTML = '<b>' + ship().name + '</b>：船員 ' + rows.length + ' 人、走路穿過砲塔那一圈 <span class="' + (tot ? 'bad' : '') + '">' + tot + '</span> 次（' + rows.filter(function (r) { return r.w; }).length + ' 人）、碰進船殼 ' + htot + ' 次；砲塔那一圈 ' + ship().rings.length + ' 座（紅圈）';
}
function events() {
  if (S.sel < 0) { $('ev').textContent = '點一個人'; return; }
  var c = DATA.crew[S.sel];
  $('ev').textContent = '#' + c.id + ' 開局 ' + DATA.roles[c.role0] + '（第 ' + c.ship0 + ' 艘名單第 ' + c.k0 + ' 個）、路徑 ' + c.tr.length + ' 點\n' + evOf(c.id).map(function (e) {
    var d = e[4], s = e[3] === 'chg' ? Object.keys(d).map(function (f) { return f + ': ' + fmt(d[f][0]) + ' → ' + fmt(d[f][1]); }).join('；') : JSON.stringify(d);
    return e[0].toFixed(1) + 's  ' + e[3] + '  ' + s; }).join('\n');
}
function fmt(v) { return v === null ? '—' : v; }
function fit() {
  var L = ship().levels[S.lv], C = ship().navC, cv = $('cv'), W = cv.clientWidth, H = cv.clientHeight; cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio;
  var x0 = L ? L.x0 : 0, w = L ? L.nx * C : ship().size[0], h = L ? L.ny * C : ship().size[1];
  V.s = Math.min(W / (w + 10), H / (h + 10)); V.ox = (W - w * V.s) / 2 - x0 * V.s; V.oy = (H - h * V.s) / 2;
}
function P(x, y) { return [V.ox + x * V.s, V.oy + y * V.s]; }
function okBits(L) { if (L._b) return L._b; var b = new Uint8Array(L.nx * L.ny), i = 0, v = 0; L.ok.split(',').forEach(function (n) { n = +n; if (v) b.fill(1, i, i + n); i += n; v ^= 1; }); return (L._b = b); }
function draw() {
  if (!DATA) return; var cv = $('cv'), g = cv.getContext('2d'), s = ship(), L = s.levels[S.lv], C = s.navC; g.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
  if (L) { var b = okBits(L); g.fillStyle = L.rot ? '#23384a' : '#1d2a36'; for (var i = 0; i < b.length; i++) if (b[i]) { var p = P(L.x0 + (i % L.nx) * C, ((i / L.nx) | 0) * C); g.fillRect(p[0], p[1], C * V.s + 0.5, C * V.s + 0.5); } }
  s.rings.forEach(function (R) { if (L && (R.z1 < L.zr[0] - 2 || R.z0 > L.zr[1] + 12)) return; var c = P(R.c[0], R.c[1]); g.strokeStyle = 'rgba(255,93,93,.55)'; g.lineWidth = Math.max(1, (R.r - R.rIn) * V.s); g.beginPath(); g.arc(c[0], c[1], (R.rIn + R.r) / 2 * V.s, 0, 7); g.stroke(); });
  var T = S.t;
  crewOf().forEach(function (c) {
    var me = c.id === S.sel; if (!me && !$('all').checked) return;
    var tr = c.tr.filter(function (q) { return q[0] <= T && q[6] === s.i && (!L || lvOf(q[3]) === S.lv); }); if (!tr.length) return;
    g.strokeStyle = me ? '#ffd166' : ROLEC[tr[tr.length - 1][5]] + (S.sel >= 0 ? '30' : '70'); g.lineWidth = me ? 2.2 : 1; g.beginPath();
    var prev = null; tr.forEach(function (q) { var p = P(q[1], q[2]); if (prev && (q[0] - prev[0] > 3 || Math.hypot(q[1] - prev[1], q[2] - prev[2]) > 30)) g.moveTo(p[0], p[1]); else if (prev) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); prev = q; }); g.stroke();
    var q = tr[tr.length - 1], p = P(q[1], q[2]); g.fillStyle = q[4] ? '#777' : me ? '#ffd166' : ROLEC[q[5]]; g.beginPath(); g.arc(p[0], p[1], me ? 4 : 2.2, 0, 7); g.fill();
  });
  DATA.ev.forEach(function (e) { if (e[3] !== 'wall' || e[4].what !== 'ring' || e[1] !== s.i || e[0] > T) return; var at = e[4].at; if (L && lvOf(at[2]) !== S.lv) return; var p = P(at[0], at[1]); g.strokeStyle = e[2] === S.sel ? '#fff' : '#ff5d5d'; g.lineWidth = 1.5; g.beginPath(); g.arc(p[0], p[1], 5, 0, 7); g.stroke(); });
  $('tv').textContent = T.toFixed(1) + ' 秒';
}
$('ship').onchange = function () { S.ship = +this.value; pickShip(); };
$('lv').onchange = function () { S.lv = +this.value; fit(); draw(); };
$('t').oninput = function () { S.t = +this.value; draw(); };
$('all').onchange = draw;
window.onresize = function () { if (DATA) { fit(); draw(); } };
$('file').onchange = function () { var f = this.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { load(JSON.parse(r.result)); }; r.readAsText(f); };
$('cv').onmousemove = function (ev) { if (!DATA) return; var r = this.getBoundingClientRect(), x = (ev.clientX - r.left - V.ox) / V.s, y = (ev.clientY - r.top - V.oy) / V.s, tip = $('tip'); tip.style.display = 'block'; tip.style.left = (ev.clientX - r.left + 12) + 'px'; tip.style.top = (ev.clientY - r.top + 8) + 'px'; tip.textContent = 'x ' + x.toFixed(1) + '、y ' + y.toFixed(1); };
$('cv').onmouseleave = function () { $('tip').style.display = 'none'; };
if (DATA) load(DATA);
</script></body></html>
