<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockside・指揮官沙盒（2D）</title>
<!-- TASK-0551：艦隊指揮官的 2D 策略沙盒。開發用（Blockside 根目錄的 sandbox.html）。
     指揮官 js/53_commander.js 跟遊戲是同一份；模擬 js/sb_sim.js（照抄遊戲的航行公式、數字從遊戲量）；畫面與批次 js/sb_ui.js。
     建置：python -I ../VoxelKit/vxk_inline.py sandbox.html ../sandbox.html -->
<style>
  :root{ --ink:#e8eef5; --dim:#9fb0c2; }
  html,body{ margin:0; background:#0e1a26; color:var(--ink); font:14px/1.5 system-ui, "Microsoft JhengHei", sans-serif; }
  #top{ padding:8px 12px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; border-bottom:1px solid rgba(255,255,255,.1); }
  #top label{ color:var(--dim); } select, input{ font:inherit; background:#1a2a3a; color:var(--ink); border:1px solid rgba(255,255,255,.2); border-radius:5px; padding:2px 5px; }
  input[type=number]{ width:56px; }
  button{ font:inherit; background:rgba(255,255,255,.08); color:var(--ink); border:1px solid rgba(255,255,255,.25); border-radius:5px; padding:3px 10px; cursor:pointer; }
  button.on{ background:#e0b453; color:#111; }
  #main{ display:flex; gap:10px; padding:8px 12px; flex-wrap:wrap; }
  #cv{ flex:1 1 560px; height:62vh; min-height:340px; border-radius:6px; }
  #side{ flex:0 1 380px; font-size:12px; max-height:62vh; overflow:auto; }
  .sr{ padding:2px 4px; border-left:3px solid; margin:2px 0; } .sr.blue{ border-color:#5aa2ff; } .sr.red{ border-color:#ff6b5a; } .sr.out{ opacity:.5; }
  #batch{ padding:6px 12px 20px; } #btab{ border-collapse:collapse; margin-top:6px; } #btab th, #btab td{ border:1px solid rgba(255,255,255,.15); padding:4px 8px; text-align:center; } #btab small{ color:var(--dim); }
  .note{ color:var(--dim); font-size:12px; max-width:980px; }
  @media (max-width:520px){ #cv{ height:48vh; } #top{ gap:4px 8px; } }
</style>
</head>
<body>
<div id="top">
  <b>指揮官沙盒（2D）</b>
  <span><label>藍</label> <input type="number" id="blueN" min="1" max="8" value="4"> <select id="blueH"></select> <select id="blueC"></select></span>
  <span><label>紅</label> <input type="number" id="redN" min="1" max="8" value="4"> <select id="redH"></select> <select id="redC"></select></span>
  <span><label>距離</label> <input type="number" id="dist" min="50" max="1000" step="10" value="140"> m</span>
  <span><label>風</label> <select id="wind"><option value="rnd">照種子</option><option value="0">往 +x</option><option value="90">往 +z</option><option value="180">往 −x</option><option value="270">往 −z</option></select></span>
  <span><label>玩法</label> <select id="play"><option value="fun">娛樂</option><option value="real">寫實</option></select></span>
  <span><label>種子</label> <input type="number" id="seed" value="1"></span>
  <button id="go">開始</button> <button id="pause">暫停</button>
  <span id="spd"><button data-s="1">1×</button><button data-s="4" class="on">4×</button><button data-s="16">16×</button><button data-s="64">64×</button></span>
  <span id="stat"></span>
</div>
<div id="main"><canvas id="cv"></canvas><div id="side"><div id="ships"></div></div></div>
<div id="batch">
  <button id="bgo">批次對打</button> <label>每格</label> <input type="number" id="bn" value="40" min="2" step="2"> 場　<label>每場最多</label> <input type="number" id="bt" value="900" step="60"> 秒　<span id="bprog" class="note"></span>
  <table id="btab"></table>
  <p class="note">批次：兩方的編成照上面那一列，策略兩兩對打；每一格的場一半換邊（藍紅、編成一起對調）⇒ 格子裡是「列的策略打欄的策略」的勝率（到時限還沒分出來 ⇒ 判定：比兩方剩下的戰力；差太少才算和局，和局算半場）、平均打多久、平均多剩幾艘。
    沙盒只模擬指揮官要的東西（位置、航向、照風的航速、兩舷的砲、船殼／砲／人三條血、每根桅的帆：中彈會隨機打掉帆、打倒桅，帆少了就慢），數字從遊戲量；風向、風速照種子（跟遊戲一樣隨機）；名次要拿完整的遊戲對照過才算數（TASK-0551）。</p>
</div>
<script src="js/53_commander.js" data-bundle="sb"></script>
<script src="js/56_rollout.js" data-bundle="sb"></script>
<script src="js/sb_sim.js" data-bundle="sb"></script>
<script src="js/sb_ui.js" data-bundle="sb"></script>
</body>
</html>
